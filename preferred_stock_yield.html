<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特別股殖利率計算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 10px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    .mode-toggle {
      display: flex;
      background: #0f172a;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
      flex-shrink: 0;
    }

    .mode-btn {
      padding: 5px 11px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .mode-btn.active { background: #6366f1; color: #fff; }

    .subtitle {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .input-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper { position: relative; display: flex; gap: 8px; }

    .prefix, .suffix {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1rem;
      font-weight: 500;
      pointer-events: none;
    }
    .prefix { left: 14px; }
    .suffix { right: 14px; }

    input[type="number"], input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1.5px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input.has-prefix { padding-left: 34px; }
    input.has-suffix { padding-right: 34px; }
    input:focus { border-color: #6366f1; }

    .fetch-btn {
      flex-shrink: 0;
      padding: 0 16px;
      background: #6366f1;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .fetch-btn:hover { background: #4f46e5; }
    .fetch-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .stock-info-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: none;
    }
    .stock-info-box.show { display: block; }
    .stock-name { font-size: 0.83rem; color: #94a3b8; line-height: 1.5; margin-bottom: 5px; }
    .stock-name strong { color: #e2e8f0; }
    .stock-highlight {
      display: inline-block;
      background: #1d4ed8;
      color: #bfdbfe;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .error-box {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.83rem;
      color: #fca5a5;
      margin-bottom: 18px;
      display: none;
      line-height: 1.5;
    }
    .error-box.show { display: block; }

    .divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 20px 0;
    }

    .result-block {
      background: #0f172a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
    }
    .result-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .result-value { font-size: 2rem; font-weight: 700; color: #4ade80; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.86rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-key { color: #64748b; }
    .detail-val { color: #cbd5e1; font-weight: 600; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      margin-left: 7px;
      vertical-align: middle;
    }
    .badge-green  { background: #166534; color: #4ade80; }
    .badge-yellow { background: #713f12; color: #fbbf24; }
    .badge-red    { background: #7f1d1d; color: #f87171; }

    .empty-state { text-align: center; color: #334155; font-size: 0.88rem; padding: 16px 0; }
    .face-note { font-size: 0.75rem; color: #475569; margin-top: 5px; }

    .spinner {
      display: inline-block;
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 5px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Watchlist ── */
    .wl-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .wl-meta { font-size: 0.78rem; color: #64748b; }
    .refresh-btn {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .refresh-btn:hover { background: #334155; color: #e2e8f0; }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .wl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    .wl-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .wl-table thead th {
      font-size: 0.68rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 0 6px 9px;
      border-bottom: 1px solid #334155;
      white-space: nowrap;
    }
    .wl-table thead th:nth-child(n+3) { text-align: right; }
    .wl-table tbody tr { border-bottom: 1px solid #1e293b; }
    .wl-table tbody tr:last-child { border-bottom: none; }
    .wl-table tbody tr:hover { background: rgba(255,255,255,0.02); }
    .wl-table td { padding: 8px 6px; vertical-align: middle; }
    .wl-table td:nth-child(n+3) { text-align: right; }

    .wl-rank  { color: #475569; font-size: 0.7rem; }
    .wl-ticker { font-weight: 700; color: #e2e8f0; font-size: 0.81rem; white-space: nowrap; }
    .wl-price  { color: #94a3b8; font-size: 0.81rem; }
    .wl-rate   { color: #64748b; font-size: 0.81rem; }
    .wl-y-hi { color: #4ade80; font-weight: 700; }
    .wl-y-md { color: #fbbf24; font-weight: 700; }
    .wl-y-lo { color: #f87171; font-weight: 600; }
    .wl-dash { color: #334155; }

    .wl-loading {
      text-align: center;
      padding: 28px 0;
      color: #64748b;
      font-size: 0.88rem;
    }
    .wl-updated { font-size: 0.68rem; color: #334155; margin-top: 10px; text-align: right; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>特別股殖利率</h1>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-manual"    onclick="setMode('manual')">手動</button>
      <button class="mode-btn"        id="btn-auto"      onclick="setMode('auto')">自動</button>
      <button class="mode-btn"        id="btn-watchlist" onclick="setMode('watchlist')">推薦</button>
    </div>
  </div>
  <p class="subtitle">票面 $25 基準 &nbsp;|&nbsp; <span id="mode-label">手動輸入</span></p>

  <!-- ── 手動 ── -->
  <div id="panel-manual">
    <div class="input-group">
      <label>市場現價</label>
      <div class="input-wrapper">
        <span class="prefix">$</span>
        <input type="number" id="m-price" class="has-prefix" placeholder="24.50" step="0.01" min="0.01">
      </div>
    </div>
    <div class="input-group">
      <label>票面股息率</label>
      <div class="input-wrapper">
        <input type="number" id="m-rate" class="has-suffix" placeholder="9.00" step="0.01" min="0.01">
        <span class="suffix">%</span>
      </div>
      <p class="face-note">依票面 $25 計算固定配息</p>
    </div>
  </div>

  <!-- ── 自動 ── -->
  <div id="panel-auto" style="display:none">
    <div class="input-group">
      <label>股票代號</label>
      <div class="input-wrapper">
        <input type="text" id="a-ticker" placeholder="例：ATLCZ、HWCPZ、JSM" style="text-transform:uppercase">
        <button class="fetch-btn" id="fetch-btn" onclick="fetchSingle()">查詢</button>
      </div>
    </div>
    <div class="error-box" id="error-box"></div>
    <div class="stock-info-box" id="stock-info">
      <div class="stock-name" id="stock-name-text"></div>
      <div id="rate-tag"></div>
    </div>
    <div id="auto-fields" style="display:none">
      <div class="input-group">
        <label>市場現價</label>
        <div class="input-wrapper">
          <span class="prefix">$</span>
          <input type="number" id="a-price" class="has-prefix" step="0.01" min="0.01">
        </div>
      </div>
      <div class="input-group">
        <label>股息率 <span style="color:#475569;text-transform:none;font-size:0.72rem">（從名稱解析）</span></label>
        <div class="input-wrapper">
          <input type="number" id="a-rate" class="has-suffix" step="0.01" min="0.01">
          <span class="suffix">%</span>
        </div>
      </div>
    </div>
  </div>

  <hr class="divider" id="main-divider">
  <div id="output">
    <div class="empty-state">輸入數值後自動顯示結果</div>
  </div>
</div>

<script>
  let currentMode = 'manual';
  let watchlistLoaded = false;

  /* ── 推薦清單（代號、Yahoo代號、簡稱、配息率均已預先驗證） ── */
  const WATCHLIST = [
    { d:'TRTN-G', y:'TRTN-PG', n:'Triton Intl. Pfd G',          r:7.50  },
    { d:'UZF',    y:'UZF',     n:'Array Digital 5.50% 2070',     r:5.50  },
    { d:'SEAL-B', y:'SEAL-PB', n:'Seapeak LLC Pfd B',            r:8.50  },
    { d:'GLOP-A', y:'GLOP-PA', n:'GasLog Partners Pfd A',        r:8.625 },
    { d:'ATLCZ',  y:'ATLCZ',   n:'Atlanticus 9.25% 2029',        r:9.25  },
    { d:'TEN-E',  y:'TEN-PE',  n:'Tsakos Energy Pfd E',          r:9.25  },
    { d:'DCBG',   y:'DCBG',    n:'Dime Community 9.00% 2034',    r:9.00  },
    { d:'FGN',    y:'FGN',     n:'F&G Annuities 7.95% 2053',     r:7.95  },
    { d:'APOS',   y:'APOS',    n:'Apollo Global 7.625% 2053',    r:7.625 },
    { d:'ATHS',   y:'ATHS',    n:'Athene Holding 7.25% 2064',    r:7.25  },
    { d:'AQNB',   y:'AQNB',    n:'Algonquin Power 6.20% 2079',   r:6.20  },
    { d:'MGRE',   y:'MGRE',    n:'Aff. Managers 6.75% 2064',     r:6.75  },
    { d:'F-D',    y:'F-PD',    n:'Ford Motor 6.50% 2062',        r:6.50  },
    { d:'HWCPZ',  y:'HWCPZ',   n:'Hancock Whitney 6.25% 2060',   r:6.25  },
    { d:'AFGD',   y:'AFGD',    n:'American Financial 5.625% 2060',r:5.625 },
    { d:'PBI-B',  y:'PBI-PB',  n:'Pitney Bowes 6.70% 2043',      r:6.70  },
    { d:'JSM',    y:'JSM',     n:'Navient 6.00% 2043',           r:6.00  },
    { d:'CTGG',   y:'CTGG',    n:'Qwest/Lumen 6.50% 2051',       r:6.50  },
    { d:'CTHH',   y:'CTHH',    n:'Qwest/Lumen 6.75% 2052',       r:6.75  },
  ];

  /* ── 模式切換 ── */
  function setMode(m) {
    currentMode = m;
    document.getElementById('panel-manual').style.display = m === 'manual' ? '' : 'none';
    document.getElementById('panel-auto').style.display   = m === 'auto'   ? '' : 'none';
    document.getElementById('main-divider').style.display = m === 'watchlist' ? 'none' : '';
    ['manual','auto','watchlist'].forEach(k =>
      document.getElementById('btn-'+k).classList.toggle('active', k === m)
    );
    document.getElementById('mode-label').textContent =
      { manual:'手動輸入', auto:'自動查詢', watchlist:'推薦標的' }[m];
    if (m === 'watchlist') {
      loadWatchlist();
    } else {
      resetOutput();
    }
  }

  /* ── CORS Proxies ── */
  const PROXIES = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
  ];

  async function tryProxies(apiUrl, timeout = 10000) {
    for (const mk of PROXIES) {
      try {
        const res = await fetch(mk(apiUrl), { signal: AbortSignal.timeout(timeout) });
        if (!res.ok) continue;
        const text = await res.text();
        if (!text || text[0] === '<') continue;
        return JSON.parse(text);
      } catch (_) {}
    }
    return null;
  }

  /* ── 手動模式 ── */
  function getBadge(y) {
    if (y >= 8) return `<span class="badge badge-green">高殖利率</span>`;
    if (y >= 5) return `<span class="badge badge-yellow">中殖利率</span>`;
    return `<span class="badge badge-red">低殖利率</span>`;
  }

  function renderResult(price, rate) {
    if (!price || !rate || price <= 0 || rate <= 0) { resetOutput(); return; }
    const annualDiv    = 25 * (rate / 100);
    const quarterDiv   = annualDiv / 4;
    const currentYield = annualDiv / price * 100;
    const premium      = (price - 25) / 25 * 100;
    document.getElementById('output').innerHTML = `
      <div class="result-block">
        <div class="result-label">目前殖利率</div>
        <div class="result-value">${currentYield.toFixed(2)}%${getBadge(currentYield)}</div>
      </div>
      <div class="result-block" style="margin-bottom:0">
        <div class="result-label">配息明細</div>
        <div class="detail-row"><span class="detail-key">票面年配息</span><span class="detail-val">$${annualDiv.toFixed(4)}</span></div>
        <div class="detail-row"><span class="detail-key">每季配息（估）</span><span class="detail-val">$${quarterDiv.toFixed(4)}</span></div>
        <div class="detail-row"><span class="detail-key">買入價格</span><span class="detail-val">$${price.toFixed(2)}</span></div>
        <div class="detail-row">
          <span class="detail-key">相對票面溢/折價</span>
          <span class="detail-val" style="color:${premium >= 0 ? '#f87171':'#4ade80'}">
            ${premium >= 0 ? '+':''}${premium.toFixed(2)}%
          </span>
        </div>
      </div>`;
  }

  function resetOutput() {
    document.getElementById('output').innerHTML = '<div class="empty-state">輸入數值後自動顯示結果</div>';
  }

  ['m-price','m-rate'].forEach(id =>
    document.getElementById(id).addEventListener('input', () => {
      if (currentMode !== 'manual') return;
      renderResult(
        parseFloat(document.getElementById('m-price').value),
        parseFloat(document.getElementById('m-rate').value)
      );
    })
  );

  /* ── 自動模式 ── */
  ['a-price','a-rate'].forEach(id =>
    document.getElementById(id).addEventListener('input', () => {
      if (currentMode !== 'auto') return;
      renderResult(
        parseFloat(document.getElementById('a-price').value),
        parseFloat(document.getElementById('a-rate').value)
      );
    })
  );

  document.getElementById('a-ticker').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchSingle();
  });

  async function fetchSingle() {
    const ticker = document.getElementById('a-ticker').value.trim().toUpperCase();
    if (!ticker) return;
    const btn = document.getElementById('fetch-btn');
    const errorBox = document.getElementById('error-box');
    const infoBox  = document.getElementById('stock-info');
    const autoFields = document.getElementById('auto-fields');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>查詢中';
    errorBox.classList.remove('show');
    infoBox.classList.remove('show');
    autoFields.style.display = 'none';
    resetOutput();

    try {
      let data = await tryProxies(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`);
      let name, price;
      if (data?.chart?.result?.[0]?.meta?.regularMarketPrice != null) {
        const m = data.chart.result[0].meta;
        name = m.longName || m.shortName; price = m.regularMarketPrice;
      } else {
        data = await tryProxies(`https://query2.finance.yahoo.com/v7/finance/quote?symbols=${ticker}&fields=longName,shortName,regularMarketPrice`);
        const q = data?.quoteResponse?.result?.[0];
        if (q?.regularMarketPrice != null) { name = q.longName||q.shortName; price = q.regularMarketPrice; }
        else throw new Error(`找不到「${ticker}」，請確認代號格式`);
      }

      const rateMatch = (name||'').match(/(\d+\.?\d+)\s*%/);
      const parsedRate = rateMatch ? parseFloat(rateMatch[1]) : null;

      document.getElementById('stock-name-text').innerHTML = `<strong>${ticker}</strong> &nbsp;—&nbsp; ${name||'（名稱未知）'}`;
      document.getElementById('rate-tag').innerHTML = parsedRate
        ? `<span class="stock-highlight">解析股息率：${parsedRate}%</span>`
        : `<span style="color:#fbbf24;font-size:0.75rem">⚠ 名稱中未找到股息率，請手動輸入</span>`;

      infoBox.classList.add('show');
      autoFields.style.display = '';
      document.getElementById('a-price').value = price ? price.toFixed(2) : '';
      document.getElementById('a-rate').value  = parsedRate || '';
      if (price && parsedRate) renderResult(price, parsedRate);

    } catch (err) {
      errorBox.innerHTML = err.message;
      errorBox.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = '查詢';
    }
  }

  /* ── 推薦模式：只抓價格，配息率已預存 ── */
  async function loadWatchlist(force = false) {
    if (watchlistLoaded && !force) return;

    const out = document.getElementById('output');
    out.innerHTML = `<div class="wl-loading"><span class="spinner"></span> 批次查詢 19 檔現價中…</div>`;

    const yahooSymbols = WATCHLIST.map(s => s.y).join(',');
    const apiUrl = `https://query2.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(yahooSymbols)}&fields=regularMarketPrice`;

    const priceMap = {};
    try {
      const json = await tryProxies(apiUrl, 15000);
      const results = json?.quoteResponse?.result;
      if (Array.isArray(results)) {
        results.forEach(r => {
          if (r?.symbol && r?.regularMarketPrice != null) priceMap[r.symbol] = r.regularMarketPrice;
        });
      }
    } catch (_) {}

    // 如果批次失敗，逐筆補抓
    const missing = WATCHLIST.filter(s => priceMap[s.y] == null);
    if (missing.length > 0 && missing.length < WATCHLIST.length) {
      await Promise.allSettled(missing.map(async s => {
        const j = await tryProxies(`https://query1.finance.yahoo.com/v8/finance/chart/${s.y}`, 8000);
        const p = j?.chart?.result?.[0]?.meta?.regularMarketPrice;
        if (p != null) priceMap[s.y] = p;
      }));
    }

    renderWatchlist(priceMap, out);
    watchlistLoaded = true;
  }

  function renderWatchlist(priceMap, container) {
    const rows = WATCHLIST.map(s => {
      const price = priceMap[s.y] ?? null;
      const yld   = price ? (25 * s.r / 100) / price * 100 : null;
      return { ...s, price, yld };
    }).sort((a, b) => {
      if (a.yld == null && b.yld == null) return 0;
      if (a.yld == null) return 1;
      if (b.yld == null) return -1;
      return b.yld - a.yld;
    });

    const yClass = y => y >= 9 ? 'wl-y-hi' : y >= 7 ? 'wl-y-md' : 'wl-y-lo';
    const loaded = rows.filter(r => r.price != null).length;
    const now = new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });

    const tbody = rows.map((row, i) => `
      <tr>
        <td class="wl-rank">${i+1}</td>
        <td class="wl-ticker">${row.d}</td>
        <td class="wl-price">${row.price != null ? '$'+row.price.toFixed(2) : '<span class="wl-dash">—</span>'}</td>
        <td class="wl-rate">${row.r}%</td>
        <td class="${row.yld != null ? yClass(row.yld) : 'wl-dash'}">${row.yld != null ? row.yld.toFixed(2)+'%' : '—'}</td>
      </tr>`).join('');

    container.innerHTML = `
      <div class="wl-header">
        <span class="wl-meta">19 檔推薦 &nbsp;|&nbsp; 已取得 ${loaded} 筆</span>
        <button class="refresh-btn" onclick="watchlistLoaded=false;loadWatchlist(true)">↺ 重新整理</button>
      </div>
      <div class="wl-wrap">
        <table class="wl-table">
          <thead>
            <tr><th>#</th><th>代號</th><th>現價</th><th>股息率</th><th>殖利率</th></tr>
          </thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
      <div class="wl-updated">更新 ${now} &nbsp;|&nbsp; 配息率來源：QuantumOnline / SEC</div>`;
  }
</script>
</body>
